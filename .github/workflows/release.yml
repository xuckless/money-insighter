# Builds the desktop app on each OS and publishes a beta pre-release.
#
#   git tag v0.2.0-beta.1 && git push origin v0.2.0-beta.1
#
# A pushed v* tag builds Linux (AppImage) and Windows (NSIS installer) and
# attaches both to a GitHub pre-release named after the tag. The app version
# is taken from the tag, so package.json does not have to be bumped first.
# Running the workflow by hand (Actions -> Release -> Run workflow) builds
# the same files as workflow artifacts without creating a release.
#
# macOS is built but not released until the app is signed and notarized;
# flip `if: false` on the mac job and add it to `release.needs` then.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            builder: --linux AppImage
            files: desktop/dist/*.AppImage
          - os: windows-latest
            name: windows
            builder: --win nsis
            files: desktop/dist/*-setup.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # Native build on each runner: the host's Go binaries and the host's
      # @embedded-postgres package, so no cross-fetching is needed.
      - run: npm run build:go
      - run: npm run build
      - run: npx electron-builder ${{ matrix.builder }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  mac:
    if: false # unsigned; enable once signing and notarization are set up
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm run build:go
      - run: npm run build
      - run: npx electron-builder --mac dmg --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: desktop/dist/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Money Insighter ${GITHUB_REF_NAME#v} (beta)" \
            --prerelease \
            --generate-notes
