# Builds the desktop app on each OS and publishes a beta pre-release.
#
#   git tag v0.2.0-beta.1 && git push origin v0.2.0-beta.1
#
# A pushed v* tag builds Linux (AppImage) and Windows (NSIS installer) and
# attaches both to a GitHub pre-release named after the tag. The app version
# is taken from the tag, so package.json does not have to be bumped first.
# Running the workflow by hand (Actions -> Release -> Run workflow) builds
# the same files as workflow artifacts without creating a release.
#
# macOS builds two signed, notarized DMGs (arm64 and x64). They upload as
# workflow artifacts rather than joining the release automatically, so that a
# stall on Apple's notary service cannot hold up the Linux and Windows
# downloads; attach them afterwards with:
#
#   gh run download <run-id> -p 'mac-*' -D /tmp/dmg
#   gh release upload <tag> /tmp/dmg/*.dmg
#
# Signing needs five repository secrets: CSC_LINK (base64 of a Developer ID
# Application .p12 that includes the Apple intermediate), CSC_KEY_PASSWORD,
# APPLE_API_KEY_P8 (base64 of an App Store Connect .p8), APPLE_API_KEY_ID and
# APPLE_API_ISSUER.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            builder: --linux AppImage
            files: desktop/dist/*.AppImage
          - os: windows-latest
            name: windows
            builder: --win nsis
            files: desktop/dist/*-setup.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # Native build on each runner: the host's Go binaries and the host's
      # @embedded-postgres package, so no cross-fetching is needed.
      - run: npm run build:go
      - run: npm run build
      - run: npx electron-builder ${{ matrix.builder }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  mac:
    runs-on: macos-latest
    # Notarization is a blocking upload of the whole ~200 MB bundle and is
    # occasionally slow; `notarytool --wait` has no cap of its own.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # The runner is arm64, and @embedded-postgres packages carry os/cpu
      # gates, so an x64 build has to ask for the other one explicitly. It
      # must land in npm's tree, not just on disk: electron-builder resolves
      # node_modules through `npm list --json`. scripts/check-pack.mjs fails
      # the build if it did not.
      - name: Postgres binaries for ${{ matrix.arch }}
        if: matrix.arch == 'x64'
        run: |
          version="$(node -p "require('./package.json').dependencies['embedded-postgres']")"
          npm i --no-save --os=darwin --cpu=x64 "@embedded-postgres/darwin-x64@${version}" \
            || node scripts/fetch-postgres.mjs darwin-x64
          rm -rf node_modules/@embedded-postgres/darwin-arm64

      # build/icon.png is 512x512, electron-builder's bare minimum for
      # generating an .icns; macOS wants 1024 for the Retina slot.
      - name: Upscale the icon
        run: |
          sips -z 1024 1024 build/icon.png --out "$RUNNER_TEMP/icon.png"
          mv "$RUNNER_TEMP/icon.png" build/icon.png

      - name: Notarization API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: printf '%s' "$APPLE_API_KEY_P8" | openssl base64 -d -A > "$RUNNER_TEMP/AuthKey.p8"

      - run: node scripts/build-go.mjs --os mac --arch ${{ matrix.arch }}
      - run: npm run build

      # electron-builder imports CSC_LINK into a temporary keychain, signs
      # every nested Mach-O file inside-out, then notarizes and staples the
      # .app before building the DMG around it. The DMG itself is left
      # unsigned on purpose: a stapled app validates offline inside one, and
      # signing it would mean a second full upload per arch.
      - name: Build and sign
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish never

      # --deep --strict is what catches an unsigned Postgres binary buried in
      # node_modules; stapler proves the notarization ticket is attached.
      - name: Verify signature and notarization
        run: |
          app="$(find dist -maxdepth 2 -name '*.app' -type d | head -1)"
          echo "checking $app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl -a -vv -t exec "$app"

      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: desktop/dist/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Money Insighter ${GITHUB_REF_NAME#v} (beta)" \
            --prerelease \
            --generate-notes
